name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate syntax
        run: |
          python -m py_compile restic_node_backup.py
          sh -n install.sh
      - name: Run tests
        run: python -m unittest discover -s tests -v
