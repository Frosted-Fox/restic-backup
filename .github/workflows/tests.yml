name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate syntax
        run: |
          python -m py_compile restic_node_backup.py
          sh -n install.sh
          sh -n install-remote.sh
      - name: Run tests
        env:
          RNB_STATE_DIR: ${{ runner.temp }}/restic-node-backup-state
          RNB_CONFIG: ${{ runner.temp }}/restic-node-backup-config/config.json
        run: python -m unittest discover -s tests -v
